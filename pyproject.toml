[project]
name = "olist-analytics"
version = "0.1.0"
description = "Containerised analytics pipeline on the Olist e-commerce dataset"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["ingestion/tests"]
