name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and dbt build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
          POSTGRES_DB: olist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U olist -d olist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: olist
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache the pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run the ingestion tests
        run: python -m pytest ingestion/tests

      - name: Load the CI sample into the raw schema
        run: python ingestion/load_raw.py --data-dir data/sample

      - name: Install the dbt packages
        working-directory: dbt
        run: dbt deps

      - name: Run dbt build (models and tests)
        working-directory: dbt
        run: dbt build

      - name: Check source freshness
        working-directory: dbt
        run: dbt source freshness

      - name: Publish the dbt artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dbt-target
          path: |
            dbt/target/manifest.json
            dbt/target/run_results.json
            dbt/target/sources.json
          if-no-files-found: warn
